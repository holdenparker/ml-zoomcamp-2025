apiVersion: apps/v1
kind: Deployment
metadata:
  name: hparker-ml-zoomcamp-2025-capstone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hparker-ml-zoomcamp-2025-capstone
  template:
    metadata:
      labels:
        app: hparker-ml-zoomcamp-2025-capstone
    spec:
      containers:
      - name: hparker-ml-zoomcamp-2025-capstone
        image: hparker-ml-zoomcamp-2025/capstone-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9697
        resources:
          requests:
            memory: "1Gi"
            cpu: "0.5"
          limits:
            memory: "2Gi"
            cpu: "1"
        readinessProbe:
          httpGet:
            path: /health
            port: 9697
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 9697
          initialDelaySeconds: 30
          periodSeconds: 20